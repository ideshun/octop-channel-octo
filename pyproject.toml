[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "octop-channel-octo"
version = "1.1.1"
description = "Standalone Octo IM channel plugin for Octop"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["websockets>=15,<16", "cryptography>=46,<50"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.setuptools]
packages = ["octo_channel_impl"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
