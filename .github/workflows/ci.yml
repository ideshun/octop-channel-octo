name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            receipts: false
          - os: macos-latest
            python: '3.12'
            receipts: false
          - os: windows-latest
            python: '3.12'
            receipts: false
          - os: ubuntu-latest
            python: '3.12'
            receipts: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install target host and test dependencies
        run: |
          python -m pip install --no-deps octop==1.0.2b9
          python -m pip install -e '.[dev]' octop-gateway==1.0.3 octop-harness==1.0.4 'mcp<2'
      - name: Apply optional host compatibility patches
        if: matrix.receipts
        run: |
          python - <<'PY'
          from pathlib import Path
          import sysconfig
          import subprocess
          site = sysconfig.get_paths()['purelib']
          for patch in sorted(Path('compat').glob('*.patch')):
              subprocess.run(['patch', '--batch', '--forward', '-p1', '-d', site, '-i', str(patch.resolve())], check=True)
          PY
      - name: Lint and test real host integration
        run: |
          ruff check .
          ruff format --check .
          python -m pytest -q
          python scripts/build_zip.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: octo-${{ matrix.os }}-${{ matrix.receipts }}
          path: dist/*.zip
